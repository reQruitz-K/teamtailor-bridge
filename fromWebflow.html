<script>
(function() {
    try {
        const dataEl = document.getElementById('job-questions-data');
        const container = document.getElementById('dynamic-questions-container');
        
        const rawData = dataEl.textContent.trim();
        
        // Helper to remove elements
        const removeElements = () => {
            if (dataEl) dataEl.remove();
            if (container) container.remove();
        };
        if (!rawData) {
            removeElements();
            return;
        }
        
        const questions = JSON.parse(rawData);
        
        if (!questions || questions.length === 0) {
            removeElements();
            return;
        }
        container.innerHTML = '';
        questions.forEach(q => {
            const wrapper = document.createElement('div');
            wrapper.className = 'question-wrapper';
            // Question Label
            const label = document.createElement('label');
            label.className = 'form_field-label'; // Updated class
            label.innerText = q.label + (q.required ? ' *' : '');
            wrapper.appendChild(label);
            let inputContainer;
            // --- RENDER LOGIC ---
            if (q.type === 'Choice' || q.type === 'select') {
                // RADIO BUTTONS (Pills)
                inputContainer = document.createElement('div');
                inputContainer.className = 'radio-group';
                (q.options || []).forEach(opt => {
                    const optLabel = document.createElement('label');
                    optLabel.className = 'radio-pill w-radio'; 
                    const radioInput = document.createElement('input');
                    radioInput.type = 'radio';
                    radioInput.name = `question_${q.id}`; 
                    radioInput.value = opt.title || opt.label;
                    radioInput.className = 'w-radio-input'; 
                    if (q.required) radioInput.required = true;
                    const textSpan = document.createElement('span');
                    textSpan.className = 'w-form-label';
                    textSpan.innerText = opt.title || opt.label;
                    optLabel.appendChild(radioInput);
                    optLabel.appendChild(textSpan);
                    inputContainer.appendChild(optLabel);
                });
            } else if (q.type === 'Range') {
                // SLIDER UI
                inputContainer = document.createElement('div');
                inputContainer.className = 'slider-container';
                
                const min = q.config?.min || 0;
                const max = q.config?.max || 10;
                const unit = q.config?.unit || 'Years';
                
                // Value Display
                const valDisplay = document.createElement('span');
                valDisplay.className = 'slider-value-display';
                valDisplay.innerText = min; 
                
                const unitDisplay = document.createElement('span');
                unitDisplay.className = 'slider-unit-display';
                unitDisplay.innerText = unit;
                // Input Range
                const rangeInput = document.createElement('input');
                rangeInput.type = 'range';
                rangeInput.className = 'custom-range'; // Custom slider class
                rangeInput.name = `question_${q.id}`;
                rangeInput.min = min;
                rangeInput.max = max;
                rangeInput.value = min; 
                if (q.required) rangeInput.required = true;
                // Update Event
                rangeInput.addEventListener('input', (e) => {
                    valDisplay.innerText = e.target.value;
                });
                inputContainer.appendChild(valDisplay);
                inputContainer.appendChild(unitDisplay);
                inputContainer.appendChild(rangeInput);
            } else {
                // FALLBACK TEXTAREA
                inputContainer = document.createElement('textarea');
                inputContainer.className = 'form_input is-new w-input'; // Updated
                inputContainer.style.borderRadius = '8px';
                inputContainer.style.padding = '12px';
                inputContainer.name = `question_${q.id}`;
                if (q.required) inputContainer.required = true;
                inputContainer.placeholder = "Type your answer here...";
                inputContainer.rows = 4;
            }
            wrapper.appendChild(inputContainer);
            container.appendChild(wrapper);
        });
    } catch (e) {
        console.error("Dynamic form error:", e);
    }
})();
</script>
<script>
document.addEventListener('DOMContentLoaded', () => {
  const fileInputs = document.querySelectorAll('.file-input-hidden');

  fileInputs.forEach(input => {
    const labelId = `${input.id}-name`; 
    const labelText = document.getElementById(labelId);
    
    if (!labelText) return;
    const defaultText = labelText.textContent;

    input.addEventListener('change', function() {
      if (this.files && this.files.length > 1) {
        labelText.textContent = `${this.files.length} files selected`;
      } else if (this.files && this.files.length === 1) {
        labelText.textContent = this.files[0].name;
      } else {
        labelText.textContent = defaultText;
      }
    });
  });
});

</script>

<script>
// Webflow + Teamtailor Dual Submission Script
// Place this in the "Before </body>" code section of the page/project.
document.addEventListener('DOMContentLoaded', function() {
    // 1. Identify the form.
    // Based on your screenshot, the Form Name is "openroles form".
    // Webflow usually adds data-name="openroles form" to the <form> tag.
    const FORM_SELECTOR = 'form[data-name="openroles form"]'; 
    const WORKER_URL = 'https://teamtailor-webflow-sync.kasper-kullberg.workers.dev/submit-application';
    // Fallback: 'form' (first form on page) if the specific one isn't found.
    
    const form = document.querySelector(FORM_SELECTOR);
    if (!form) {
        console.warn("Specific form not found, falling back to first form.");
        form = document.querySelector('form');
    }
    if (!form) return;
    // PREVENT DUPLICATE BINDING
    if (form.getAttribute('data-tt-bound')) {
        console.log("Teamtailor listener already bound. Skipping.");
        return;
    }
    form.setAttribute('data-tt-bound', 'true');
    // Helper: Clone FormData (for logging/debugging if needed)
    // const debugData = (fd) => { for(var pair of fd.entries()) { console.log(pair[0]+ ', '+ pair[1]); } };
    // 2. Attach Listener
    // We use jQuery here because Webflow's own scripts heavily rely on jQuery events.
    // Hooking into submit with jQuery ensures we play nice with Webflow's validation.
    
    $(form).submit(async function(e) {
        // Stop Webflow submission COMPLETELY.
        e.preventDefault();
        e.stopPropagation();
        e.stopImmediatePropagation(); // Prevent other listeners from firing
        const submitBtn = $(this).find('input[type="submit"], .submit-button');
        const originalText = submitBtn.val() || submitBtn.text();
        submitBtn.val('Sending...').text('Sending...');
        submitBtn.prop('disabled', true);
        try {
            // A. Create FormData
            const formData = new FormData(this);
            // B. Send to Teamtailor Worker
            console.log("Sending to Teamtailor...");
            const response = await fetch(WORKER_URL, {
                method: 'POST',
                body: formData
            });
            if (!response.ok) {
                const errText = await response.text();
                throw new Error(`Worker Error: ${response.status} ${errText}`);
            }
            
            const json = await response.json();
            console.log("Teamtailor Success:", json);
            // C. Show Success State (Manual)
            // Webflow forms usually have a success div sibling.
            const parent = $(this).parent();
            const successDiv = parent.find('.w-form-done');
            const errorDiv = parent.find('.w-form-fail');
            $(this).hide(); // Hide form
            successDiv.show(); // Show success message
            errorDiv.hide();
        } catch (err) {
            console.error("Submission Failed:", err);
            
            // Show Error State
            const parent = $(this).parent();
            const errorDiv = parent.find('.w-form-fail');
            errorDiv.show();
            
            // Allow retry
            submitBtn.val(originalText).text(originalText);
            submitBtn.prop('disabled', false);
        }
    });
});
</script>
